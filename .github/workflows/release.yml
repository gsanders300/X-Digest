name: Release

# A push to the default branch releases the version in pyproject.toml when that tag does
# not exist yet. Pushes that don't bump the version (docs, CI) release nothing.
on:
  push:
    branches: ['**']

# One release at a time per branch so two quick pushes can't claim the same version.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    # Only the default branch of gsanders300's own repos cuts releases; copies made by others skip this.
    if: github.repository_owner == 'gsanders300' && github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0  # full history so existing version tags are visible
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          version=$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          next="v${version}"
          if git rev-parse -q --verify "refs/tags/${next}" >/dev/null; then
            echo "${next} already exists; bump version in pyproject.toml to release."
            exit 0
          fi
          gh release create "$next" --target "$GITHUB_SHA" --title "$next" --notes "$MESSAGE"
