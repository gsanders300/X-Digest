name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    strategy:
      matrix:
        # The requires-python floor and the pinned development version.
        python-version: ["3.11", "3.14"]

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}

      # --locked fails when uv.lock is stale, so a stale lock can never be released.
      - name: Check the locked environment
        run: uv run --locked digest.py --help

      - name: Run tests
        run: uv run --locked python -m unittest discover -s tests -v

  # release.yml only releases a version whose tag doesn't exist yet, so shipped code
  # changes without a version bump would never reach a release.
  version-bump:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0  # full history so existing version tags are visible

      - name: Require a version bump when shipped code changes
        run: |
          latest=$(git tag --list 'v*.*.*' --sort=-v:refname | head -n1)
          if [ -z "$latest" ]; then
            echo "No release tags yet; nothing to compare."
            exit 0
          fi
          version=$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          if ! git diff --quiet "$latest" HEAD -- digest.py template.html pyproject.toml uv.lock \
              && [ "v${version}" = "$latest" ]; then
            echo "::error::Shipped code or dependencies changed since ${latest}, but pyproject.toml is still ${version}. Bump version and run uv lock."
            exit 1
          fi
          echo "OK: latest tag ${latest}, pyproject.toml version ${version}."
