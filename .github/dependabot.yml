version: 2

# Weekly grouped updates. dependabot-auto-merge.yml bumps the patch version on the
# Python PR and merges both once Tests pass. Major versions get their own "-major" groups:
# auto-merge still bumps the version on those PRs but leaves the merge to you.
updates:
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
      day: saturday
      time: "03:00"
      timezone: America/New_York
    # handles.txt is X handles, not pip requirements; Dependabot would look them up on PyPI.
    exclude-paths:
      - "handles.txt"
    # Without this, only the 3 direct dependencies are checked, not the rest of uv.lock.
    allow:
      - dependency-type: all
    groups:
      python-packages:
        patterns: ["*"]
        update-types: [minor, patch]
      python-packages-major:
        patterns: ["*"]
        update-types: [major]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: saturday
      time: "03:00"
      timezone: America/New_York
    groups:
      github-actions:
        patterns: ["*"]
        update-types: [minor, patch]
      github-actions-major:
        patterns: ["*"]
        update-types: [major]
